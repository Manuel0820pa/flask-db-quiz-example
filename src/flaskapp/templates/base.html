<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Handlee&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <title>Quizzes</title>
  <style>
    :root {
        --accent: #6c5ce7;
        --accent-dark: #5849c2;
        --bg: #f6f5fb;
        --card-bg: #ffffff;
        --text: #2d2d3a;
        --muted: #6b6b7b;
        --success-bg: #eafbea;
        --success-border: #34c759;
        --radius: 14px;
    }

    * {
        box-sizing: border-box;
    }

    h1, h2, h3, h4 {
        font-family: 'Handlee', cursive;
        color: var(--text);
    }

    body {
        font-family: 'Nunito', Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, var(--bg) 0%, #eeeaf9 100%);
        color: var(--text);
        margin: 0;
        min-height: 100vh;
    }

    .page {
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 20px 80px;
    }

    header h1 {
        font-size: 2.6rem;
        margin-bottom: 4px;
    }

    .subtitle {
        color: var(--muted);
        margin-top: 0;
    }

    .quiz-list {
        list-style: none;
        padding: 0;
        display: grid;
        gap: 12px;
    }

    .quiz-list li {
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: 0 2px 10px rgba(60, 50, 100, 0.08);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .quiz-list li:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(60, 50, 100, 0.14);
    }

    .quiz-list a {
        display: block;
        padding: 18px 20px;
        color: var(--accent-dark);
        text-decoration: none;
        font-weight: 700;
        font-size: 1.1rem;
    }

    legend {
        font-weight: 700;
        color: var(--text);
    }

    .name-field {
        background: var(--card-bg);
        border-radius: var(--radius);
        padding: 16px 20px;
        box-shadow: 0 2px 10px rgba(60, 50, 100, 0.08);
        margin-bottom: 20px;
    }

    .name-field input {
        margin-left: 8px;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 1rem;
        font-family: inherit;
    }

    .question {
        background: var(--card-bg);
        border-left: 5px solid var(--accent);
        border-radius: var(--radius);
        padding: 18px 20px;
        margin-top: 16px;
        margin-bottom: 16px;
        box-shadow: 0 2px 10px rgba(60, 50, 100, 0.08);
    }

    .question label {
        display: block;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.12s ease;
    }

    .question label:hover {
        background: #f1effc;
    }

    .question input[type="radio"] {
        margin-right: 8px;
        accent-color: var(--accent);
    }

    button[type="submit"] {
        background: var(--accent);
        color: white;
        border: none;
        padding: 14px 28px;
        border-radius: 999px;
        font-size: 1.05rem;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(108, 92, 231, 0.35);
        transition: background 0.15s ease, transform 0.1s ease;
    }

    button[type="submit"]:hover {
        background: var(--accent-dark);
        transform: translateY(-1px);
    }

    #score p {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 18px;
        border-radius: 999px;
        background: var(--success-bg);
        border: 1px solid var(--success-border);
        font-weight: 700;
    }

    #scores {
        background: var(--card-bg);
        border-radius: var(--radius);
        padding: 10px 20px;
        box-shadow: 0 2px 10px rgba(60, 50, 100, 0.08);
    }

    #scores ol {
        padding-left: 24px;
    }

    #scores li {
        padding: 4px 0;
    }
  </style>
</head>
<body>

    <div class="page">
    {% block content %}
    {% endblock %}
    </div>

</body>
</html>
