name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Pruebas unitarias (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt -r requirements-dev.txt

      - name: Ejecutar pytest con cobertura
        env:
          DBUSER: app_user
          DBPASS: app_password
          DBHOST: localhost
          DBNAME: app
        run: |
          python -m pytest tests/test_quizzes.py tests/test_seeder.py tests/test_health.py -v

  selenium-e2e:
    name: Pruebas E2E (Selenium)
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt -r requirements-dev.txt

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Ejecutar pruebas Selenium
        env:
          DBUSER: app_user
          DBPASS: app_password
          DBHOST: localhost
          DBNAME: app
          CI: "true"
        run: |
          python -m pytest tests/test_selenium_e2e.py -v --no-cov

  docker-build-and-scan:
    name: Build de Docker + escaneo de seguridad
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Build de la imagen Docker
        run: docker build -t flask-quiz:${{ github.sha }} .

      - name: Escaneo de seguridad (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: flask-quiz:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Escaneo de dependencias Python (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r src/requirements.txt || true